<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media2Motion · Image/Video → 3D Skeleton Motion</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .status {
    font-size: 12px; padding: 4px 10px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--border); color: var(--dim);
  }
  .status.ok { color: var(--green); border-color: var(--green); }
  .status.warn { color: var(--orange); border-color: var(--orange); }
  #btnLang {
    flex: none; margin-left: auto; width: 64px; padding: 5px 0;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  /* 左侧：媒体输入面板 */
  .left {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel);
  }
  .upload-area {
    margin: 16px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 22px 16px;
    text-align: center;
    color: var(--dim);
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .upload-area .hint { font-size: 12px; margin-top: 6px; }
  .btn-row { display: flex; gap: 10px; padding: 0 16px; }
  button {
    flex: 1;
    padding: 9px 0;
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .media-wrap {
    flex: 1;
    margin: 16px;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .media-wrap .placeholder { color: #484f58; font-size: 13px; }
  #previewCanvas, #mediaVideo, #mediaImg {
    max-width: 100%; max-height: 100%;
    display: none;
  }
  .controls { padding: 0 16px 16px; flex-shrink: 0; }
  .ctrl-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; margin-top: 10px; color: var(--dim);
  }
  .ctrl-row input[type=range] { width: 160px; accent-color: var(--accent); }
  .ctrl-row label { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
  .ctrl-row input[type=checkbox] { accent-color: var(--accent); }
  /* 右侧：3D 视口 */
  .right { flex: 1; position: relative; min-width: 0; }
  #threeCanvas { width: 100%; height: 100%; display: block; }
  .viewport-tag {
    position: absolute; top: 12px; left: 14px;
    font-size: 12px; color: var(--dim);
    background: rgba(13,17,23,.7); padding: 4px 10px; border-radius: 6px;
  }
</style>
</head>
<body>
<header>
  <h1>Media<span>2</span>Motion · <span data-i18n="appSubtitle">图片/视频 → 3D 骨骼驱动</span></h1>
  <div class="status" id="stModel" data-i18n="modelLoading">模型加载中…</div>
  <div class="status" id="stPose" data-i18n="poseLoading">姿态引擎加载中…</div>
  <div class="status" id="stDetect" data-i18n="waiting">等待输入</div>
  <div class="status" id="stHead">头: --</div>
  <button id="btnLang">EN</button>
</header>
<main>
  <div class="left">
    <div class="upload-area" id="dropArea">
      <div data-i18n="uploadTitle">拖入 图片 / 视频，或直接 Ctrl+V 粘贴图片</div>
      <div class="hint" data-i18n="uploadHint">支持 jpg / png / mp4 / webm 等，支持截图后直接粘贴</div>
    </div>
    <div class="btn-row">
      <button id="btnImage" data-i18n="btnImage">选图片</button>
      <button id="btnVideo" data-i18n="btnVideo">选视频</button>
      <button id="btnPlay" style="display:none">⏸ <span data-i18n="btnPause">暂停</span></button>
      <button id="btnRedetect" style="display:none">🔄 <span data-i18n="btnRedetect">重新识别</span></button>
    </div>
    <div class="media-wrap" id="mediaWrap">
      <div class="placeholder" id="placeholder" data-i18n="placeholder">未加载媒体</div>
      <img id="mediaImg" alt="">
      <video id="mediaVideo" muted loop playsinline></video>
      <canvas id="previewCanvas"></canvas>
    </div>
    <div class="controls">
      <div class="ctrl-row">
        <label><input type="checkbox" id="showSkeleton" checked> <span data-i18n="chkSkeleton">关键点叠加</span></label>
        <label><input type="checkbox" id="showInput" checked> <span data-i18n="chkInput3d">3D输入骨架</span></label>
      </div>
      <div class="ctrl-row">
        <span data-i18n="lblSmooth">平滑</span>
        <input type="range" id="smooth" min="0.05" max="1" step="0.05" value="0.5">
        <span id="smoothVal">0.50</span>
      </div>
      <div class="ctrl-row">
        <span data-i18n="lblThresh">检测阈值</span>
        <input type="range" id="sens" min="0.1" max="0.9" step="0.05" value="0.5">
        <span id="sensVal">0.50</span>
      </div>
      <div class="ctrl-row" id="seekRow" style="display:none">
        <input type="range" id="seek" min="0" max="0" step="0.05" value="0" style="flex:1">
        <span id="seekTime">0:00</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none">
  </div>
  <div class="right">
    <canvas id="threeCanvas"></canvas>
    <div class="viewport-tag" data-i18n="viewport">3D 视口 · 拖拽旋转 / 滚轮缩放</div>
  </div>
</main>

<script src="libs/three.min.js"></script>
<script src="libs/GLTFLoader.js"></script>
<script src="libs/pose/pose.js"></script>
<script src="i18n.js"></script>
<script src="main.js"></script>
</body>
</html>
